<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Course Guard learner and system flow</title>
  <desc id="flow-desc">The learner selects a course website, starts Course Guard, leaves the course origin, receives a supportive return interruption, returns to the course, and completes the session. The Learning Plaza web app connects through a secure allowlisted bridge to the authoritative Course Guard extension.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243347" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b94f56" />
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#243347" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect x="16" y="16" width="1168" height="868" rx="34" fill="#fff7e9" stroke="#243347" stroke-width="4" />
  <text x="60" y="82" fill="#755b82" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3">THE LEARNER LOOP</text>
  <text x="60" y="120" fill="#56657a" font-family="Arial, sans-serif" font-size="20">A clear boundary, a gentle return, and control that stays with the learner.</text>

  <g filter="url(#soft-shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="190" width="160" height="112" rx="20" fill="#a9d8e8" stroke="#243347" stroke-width="4" />
    <text x="135" y="237" fill="#243347" font-size="22" font-weight="800"><tspan x="135" dy="0">Select</tspan><tspan x="135" dy="28">Course Website</tspan></text>

    <rect x="250" y="190" width="160" height="112" rx="20" fill="#ffd66b" stroke="#243347" stroke-width="4" />
    <text x="330" y="237" fill="#243347" font-size="22" font-weight="800"><tspan x="330" dy="0">Start</tspan><tspan x="330" dy="28">Course Guard</tspan></text>

    <rect x="445" y="190" width="160" height="112" rx="20" fill="#fffefa" stroke="#243347" stroke-width="4" />
    <text x="525" y="237" fill="#243347" font-size="22" font-weight="800"><tspan x="525" dy="0">Leave</tspan><tspan x="525" dy="28">course origin</tspan></text>

    <rect x="640" y="190" width="160" height="112" rx="20" fill="#ef8e72" stroke="#b94f56" stroke-width="4" />
    <text x="720" y="237" fill="#fffefa" font-size="22" font-weight="800"><tspan x="720" dy="0">Return</tspan><tspan x="720" dy="28">interruption</tspan></text>

    <rect x="835" y="190" width="160" height="112" rx="20" fill="#a9d8e8" stroke="#243347" stroke-width="4" />
    <text x="915" y="237" fill="#243347" font-size="22" font-weight="800"><tspan x="915" dy="0">Back to</tspan><tspan x="915" dy="28">course</tspan></text>

    <rect x="1030" y="190" width="115" height="112" rx="20" fill="#68a86e" stroke="#2e6941" stroke-width="4" />
    <text x="1087" y="237" fill="#fffefa" font-size="20" font-weight="800"><tspan x="1087" dy="0">Session</tspan><tspan x="1087" dy="27">complete</tspan></text>
  </g>

  <g fill="none" stroke="#243347" stroke-width="5" marker-end="url(#arrow-ink)">
    <path d="M 215 246 H 245" />
    <path d="M 410 246 H 440" />
    <path d="M 605 246 H 635" />
    <path d="M 800 246 H 830" />
    <path d="M 995 246 H 1025" />
  </g>
  <text x="720" y="340" fill="#b94f56" font-family="Arial, sans-serif" font-size="19" font-weight="800" text-anchor="middle">One supportive prompt — one clear way back</text>

  <rect x="55" y="414" width="1090" height="334" rx="28" fill="#f4f0fa" stroke="#755b82" stroke-width="4" stroke-dasharray="14 9" />
  <text x="90" y="468" fill="#755b82" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="2">SYSTEM BOUNDARY</text>
  <text x="90" y="505" fill="#56657a" font-family="Arial, sans-serif" font-size="19">Only approved guard state and recovery fields cross the bridge.</text>

  <g filter="url(#soft-shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="92" y="568" width="215" height="105" rx="18" fill="#a9d8e8" stroke="#243347" stroke-width="4" />
    <text x="199" y="613" fill="#243347" font-size="21" font-weight="800"><tspan x="199" dy="0">Learning Plaza</tspan><tspan x="199" dy="28">web app</tspan></text>

    <rect x="355" y="568" width="215" height="105" rx="18" fill="#fffefa" stroke="#243347" stroke-width="4" />
    <text x="462" y="613" fill="#243347" font-size="21" font-weight="800"><tspan x="462" dy="0">Secure allowlisted</tspan><tspan x="462" dy="28">bridge</tspan></text>

    <rect x="618" y="568" width="215" height="105" rx="18" fill="#ffd66b" stroke="#243347" stroke-width="4" />
    <text x="725" y="613" fill="#243347" font-size="21" font-weight="800"><tspan x="725" dy="0">Course Guard</tspan><tspan x="725" dy="28">extension</tspan></text>

    <rect x="881" y="568" width="215" height="105" rx="18" fill="#fffefa" stroke="#243347" stroke-width="4" />
    <text x="988" y="613" fill="#243347" font-size="21" font-weight="800"><tspan x="988" dy="0">Browser tab</tspan><tspan x="988" dy="28">origin</tspan></text>
  </g>

  <g fill="none" stroke="#243347" stroke-width="5" marker-end="url(#arrow-ink)">
    <path d="M 307 620 H 350" />
    <path d="M 570 620 H 613" />
    <path d="M 833 620 H 876" />
  </g>

  <rect x="90" y="790" width="1006" height="54" rx="27" fill="#fffefa" stroke="#ef8e72" stroke-width="3" />
  <text x="593" y="825" fill="#243347" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Extension authority · explicit consent · no page contents</text>
</svg>
