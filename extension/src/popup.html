<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Plaza companion</title>
    <style>
      :root {
        --sky: #a9d8e8;
        --grass: #68a86e;
        --grass-dark: #2e6941;
        --sun: #ffd66b;
        --coral: #ef8e72;
        --ink: #243347;
        --muted: #56657a;
        --panel: #fff7e9;
        --line: rgba(36, 51, 71, 0.18);
        background: var(--sky);
        color: var(--ink);
        font:
          14px/1.45 "IBM Plex Sans",
          system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        margin: 0;
      }
      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }
      .popup-header {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }
      .eyebrow {
        color: var(--grass-dark);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0;
        text-transform: uppercase;
      }
      h1 {
        font:
          600 23px/1.05 Newsreader,
          Georgia,
          serif;
        margin: 2px 0 0;
      }
      p {
        margin: 0;
      }
      .plaza-mark {
        background: var(--sun);
        border: 2px solid var(--ink);
        border-radius: 50%;
        height: 28px;
        position: relative;
        width: 28px;
      }
      .plaza-mark::after {
        background: var(--coral);
        border-radius: 50%;
        content: "";
        height: 8px;
        left: 8px;
        position: absolute;
        top: 8px;
        width: 8px;
      }
      .companion-card {
        align-items: center;
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 18px;
        display: flex;
        gap: 12px;
        padding: 12px;
      }
      .companion {
        background: var(--coral);
        border: 2px solid var(--ink);
        border-radius: 42% 42% 48% 48%;
        height: 64px;
        position: relative;
        width: 64px;
      }
      .companion::before,
      .companion::after {
        background: var(--coral);
        border: 2px solid var(--ink);
        border-radius: 50% 50% 0 50%;
        content: "";
        height: 18px;
        position: absolute;
        top: -8px;
        width: 18px;
      }
      .companion::before {
        left: 3px;
        transform: rotate(-15deg);
      }
      .companion::after {
        right: 3px;
        transform: scaleX(-1) rotate(-15deg);
      }
      .companion-face {
        align-items: center;
        background: #ffe5c5;
        border: 2px solid var(--ink);
        border-radius: 50%;
        display: flex;
        gap: 10px;
        height: 35px;
        justify-content: center;
        left: 13px;
        position: absolute;
        top: 15px;
        width: 35px;
      }
      .companion-face::before,
      .companion-face::after {
        background: var(--ink);
        border-radius: 50%;
        content: "";
        height: 5px;
        width: 5px;
      }
      .companion-face::after {
        box-shadow: -1px 11px 0 -1px var(--ink);
      }
      .companion-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .companion-copy strong {
        font-size: 16px;
      }
      .companion-copy span {
        color: var(--muted);
      }
      .status {
        color: var(--muted);
      }
      .course {
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .progress {
        color: var(--grass-dark);
        font-size: 12px;
      }
      #message {
        color: #9a4d39;
        min-height: 18px;
      }
      .actions {
        display: grid;
        gap: 8px;
      }
      button,
      .open-plaza {
        border-radius: 12px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 42px;
        padding: 0 14px;
        text-align: center;
      }
      button {
        background: var(--grass);
        border: 2px solid var(--grass-dark);
        color: #fffdf5;
      }
      button[data-active="true"] {
        background: var(--panel);
        color: var(--grass-dark);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }
      .open-plaza {
        background: transparent;
        border: 0;
        color: var(--grass-dark);
        padding: 7px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      :focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="popup-header">
        <div>
          <p class="eyebrow">Learning Plaza</p>
          <h1>Companion check-in</h1>
        </div>
        <span aria-hidden="true" class="plaza-mark" />
      </header>
      <section class="companion-card" aria-label="Focus Friend status">
        <div aria-hidden="true" class="companion"><span class="companion-face" /></div>
        <div class="companion-copy">
          <strong id="course">No course selected</strong>
          <span id="status">Momo is ready when you are.</span>
          <span class="progress" id="progress">Open your course, then begin.</span>
        </div>
      </section>
      <p id="message" role="alert"></p>
      <div class="actions">
        <button id="toggle" type="button">Start guard</button>
        <button class="open-plaza" id="open-plaza" type="button">Open Learning Plaza</button>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
